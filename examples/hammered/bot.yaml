name: Hammered University
welcome: "Welcome to the world’s most prestigious university. A fictional campus for a real knowledge demo."
instructions: >-
  Explain the supplied fictional policies clearly and concisely. This is a demo,
  not a real organization. Treat superlatives as playful slogans, not verified claims.
  Never invent live records, contact details, exceptions, or completed actions.
  When a document says information is unavailable, explain that limit.
  For multi-part questions, distinguish supported facts from unknown details.
mode: knowledge
min_score: 0.3
top_k: 4
chunk_tokens: 200
chunk_overlap: 32
context_chars: 12000
topics:
  - name: University overview and assistant limits
    description: What this fictional university offers and which live student records are unavailable.
    sources: [about.md]
  - name: Courses
    description: Course content, prerequisites, schedules, recordings, and study expectations.
    sources: [courses.md]
  - name: Enrollment
    description: Certificate requirements, course loads, deadlines, prerequisites, and wait lists.
    sources: [enrollment.md]
  - name: Calendar, tuition, and withdrawals
    description: Term dates, fees, payment deadlines, add/drop rules, and refunds.
    sources: [calendar-fees.md]
  - name: Grading
    description: Grade bands, weighted scores, passing requirements, and retakes.
    sources: [grading.md]
  - name: Student support and accommodations
    description: Advising boundaries, disability accommodations, and unavailable live support channels.
    sources: [student-support.md]
  - name: Learning platform
    description: Supported browsers, assignment uploads, confirmation numbers, and troubleshooting.
    sources: [learning-platform.md]
  - name: Certificates and records
    description: Completion requirements, digital certificates, grade summaries, and transcript limits.
    sources: [certificates-records.md]
suggested_questions:
  - What can you help me with?
  - What does the Product Foundations Certificate require?
  - When does Spring 2027 enrollment close?
  - How is the final grade calculated?
  - When will my digital certificate be available?
  - Can you check whether a course has seats available now?
