[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "eve-ah"
version = "0.1.0"
description = "A self-hosted AI assistant for your documents, with source citations and your choice of model provider."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Tony Pushkal"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.9,<3", "python-dotenv>=1,<2", "PyYAML>=6,<7",
  "numpy>=1.26,<3", "faiss-cpu>=1.9,<2", "sentence-transformers>=3.3,<6",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "filelock>=3.16,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
eve-ah = "eve_ah.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eve_ah"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
